openapi: 3.0.3
info:
  title: ClinicDesk API
  version: 1.0.0
  description: |
    HTTP API for clinics, doctors, appointments, and role-based auth.
    Each clinic has one doctor. Creating an appointment attaches that clinic's doctor.

    Roles: `SUPER_ADMIN`, `CLINIC` (one clinic via clinicId), `PATIENT`.
    `POST /auth/register` always creates a PATIENT.
    Login returns JWT `accessToken` (15 minutes) and `refreshToken` (7 days).
    Bearer auth is issued today; appointment and clinic routes are not JWT-guarded yet.
servers:
  - url: http://localhost:3333
    description: Local API

tags:
  - name: Auth
  - name: Clinics
  - name: Doctors
  - name: Appointments
  - name: AI

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a patient
      description: Always creates a PATIENT. `role` and `clinicId` in the body are ignored.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: new.patient@test.com
              password: ClinicDesk!23
              name: New Patient
      responses:
        '201':
          description: Created patient user (no password hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/createUser:
    post:
      tags: [Auth]
      summary: Create a user
      description: |
        Creates a user with an explicit role. Defaults to PATIENT when role is omitted.
        CLINIC users must send a valid `clinicId`. SUPER_ADMIN and PATIENT must not send `clinicId`.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created user (no password hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Returns a public user plus JWT access and refresh tokens.
        Invalid email, invalid password, and inactive users all return 401
        with `Invalid email or password`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: priya.sharma@test.com
              password: ClinicDesk!23
      responses:
        '201':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      description: Verifies the refresh token, revokes it, and issues a new access/refresh pair.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '201':
          description: New authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Revokes the supplied refresh token. Already-invalid tokens still return success.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '201':
          description: Refresh token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /auth/user/{id}:
    get:
      tags: [Auth]
      summary: Get a user
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Public user (no password hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '404':
          $ref: '#/components/responses/NotFound'

  /clinics:
    get:
      tags: [Clinics]
      summary: List clinics
      operationId: listClinics
      parameters:
        - $ref: '#/components/parameters/ClinicSearch'
      responses:
        '200':
          description: Clinics matching the search. An empty search returns every clinic.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clinic'
    post:
      tags: [Clinics]
      summary: Create a clinic
      operationId: createClinic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicCreate'
      responses:
        '201':
          description: Created clinic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'

  /clinics/{id}:
    get:
      tags: [Clinics]
      summary: Get a clinic
      operationId: getClinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: The clinic, or null when the id does not exist.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Clinic'
    put:
      tags: [Clinics]
      summary: Update a clinic
      operationId: updateClinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicUpdate'
      responses:
        '200':
          description: Updated clinic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Clinics]
      summary: Delete a clinic
      description: Deletes the clinic, its doctor, and its appointments.
      operationId: deleteClinic
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Deleted clinic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '404':
          $ref: '#/components/responses/NotFound'

  /doctors:
    get:
      tags: [Doctors]
      summary: List doctors
      operationId: listDoctors
      responses:
        '200':
          description: Every doctor. There is one doctor per clinic.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Doctor'

  /doctors/clinic/{clinicId}:
    get:
      tags: [Doctors]
      summary: Get the doctor for a clinic
      operationId: getDoctorByClinic
      parameters:
        - name: clinicId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The clinic's doctor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '404':
          $ref: '#/components/responses/NotFound'

  /doctors/{id}:
    get:
      tags: [Doctors]
      summary: Get a doctor
      operationId: getDoctor
      parameters:
        - $ref: '#/components/parameters/DoctorId'
      responses:
        '200':
          description: The doctor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments:
    get:
      tags: [Appointments]
      summary: List appointments
      operationId: listAppointments
      parameters:
        - name: clinicId
          in: query
          schema:
            type: string
          description: Limit results to one clinic.
        - name: date
          in: query
          schema:
            type: string
            format: date
            example: '2026-01-15'
          description: Appointments whose start time falls on this calendar day.
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AppStatus'
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive match on patient name, patient email, or reason.
      responses:
        '200':
          description: Appointments ordered by start time, with clinic and doctor summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppointmentDetails'
    post:
      tags: [Appointments]
      summary: Create an appointment
      description: The server sets doctorId to the doctor that belongs to clinicId.
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Created appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: The clinic has no doctor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: Get an appointment
      operationId: getAppointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: The appointment, including clinic contact details and the doctor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetails'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Appointments]
      summary: Update an appointment
      description: When clinicId changes, the appointment is linked to that clinic's doctor.
      operationId: updateAppointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdate'
      responses:
        '200':
          description: Updated appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Appointments]
      summary: Delete an appointment
      operationId: deleteAppointment
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Deleted appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'

  /appointments/{id}/status:
    put:
      tags: [Appointments]
      summary: Update appointment status
      operationId: updateAppointmentStatus
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
        - name: status
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AppStatus'
      responses:
        '200':
          description: Appointment with the new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          $ref: '#/components/responses/NotFound'

  /ai/suggestAppointmentDetails:
    post:
      tags: [AI]
      summary: Suggest appointment duration and preparation notes
      operationId: suggestAppointmentDetails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSuggestionRequest'
      responses:
        '200':
          description: Suggested duration, preparation notes, and confidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSuggestion'

components:
  parameters:
    ClinicId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Clinic id. On `/doctors/clinic/{clinicId}` the path parameter name is clinicId.
    DoctorId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ClinicSearch:
      name: search
      in: query
      schema:
        type: string
      description: Case-insensitive match on clinic name, address, email, or phone number.
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login. Not required on other routes yet.

  responses:
    NotFound:
      description: The record was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request body is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid credentials or refresh token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Email is already registered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    AppStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]

    UserRole:
      type: string
      enum: [SUPER_ADMIN, CLINIC, PATIENT]

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
        error:
          type: string
          example: Not Found

    WorkingHours:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Sunday, 6 is Saturday.
        startTime:
          type: string
          example: '09:00'
        endTime:
          type: string
          example: '17:00'

    Clinic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        timezone:
          type: string
          example: Europe/Amsterdam
        workingHours:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHours'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClinicCreate:
      type: object
      required: [name, address, email, phoneNumber, timezone, workingHours]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        timezone:
          type: string
          example: Europe/Amsterdam
        workingHours:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHours'

    ClinicUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        timezone:
          type: string
        workingHours:
          type: array
          items:
            $ref: '#/components/schemas/WorkingHours'

    Doctor:
      type: object
      properties:
        id:
          type: string
        clinicId:
          type: string
        name:
          type: string
          example: Dr. Ahuja
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Appointment:
      type: object
      properties:
        id:
          type: string
        clinicId:
          type: string
        doctorId:
          type: string
        patientId:
          type: string
          nullable: true
          description: Linked User id when the patient is a registered user.
        patientName:
          type: string
        patientEmail:
          type: string
          format: email
        reason:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppStatus'
        cancelToken:
          type: string
          nullable: true
        aiSuggestion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiSuggestion'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppointmentDetails:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          properties:
            clinic:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                address:
                  type: string
                phoneNumber:
                  type: string
            doctor:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email

    AppointmentCreate:
      type: object
      required: [clinicId, patientName, patientEmail, reason, startTime, endTime]
      properties:
        clinicId:
          type: string
        patientName:
          type: string
        patientEmail:
          type: string
          format: email
        reason:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppStatus'

    AppointmentUpdate:
      type: object
      properties:
        clinicId:
          type: string
        patientName:
          type: string
        patientEmail:
          type: string
          format: email
        reason:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppStatus'

    AiSuggestionRequest:
      type: object
      required: [appointmentId, patientName, reason]
      properties:
        appointmentId:
          type: string
        patientName:
          type: string
        reason:
          type: string

    AiSuggestion:
      type: object
      properties:
        suggestedDuration:
          type: integer
          enum: [15, 30, 45, 60]
        prepNotes:
          type: string
        confidence:
          type: string
          enum: [low, medium, high]

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string

    CreateUserRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        clinicId:
          type: string
          description: Required when role is CLINIC.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        clinicId:
          type: string
          nullable: true
        isActive:
          type: boolean

    AuthLoginResponse:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        accessToken:
          type: string
          description: JWT, 15 minutes. Use as Authorization Bearer token.
        refreshToken:
          type: string
          description: JWT, 7 days. Send to /auth/refresh or /auth/logout.

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true

